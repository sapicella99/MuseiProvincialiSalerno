<div class="container mt-5">


<h1 class="text-center mb-4">
Prenota la tua visita
</h1>



<div class="card shadow p-4">


<h3 id="nomeMuseo">
    Caricamento museo...
</h3>

<div class="mb-3" id="contenitoreMusei" style="display:none;">

    <label class="form-label">

        Seleziona il museo

    </label>

    <select id="selectMuseo" class="form-select">

    </select>

</div>



<form id="formPrenotazione">


<div class="mb-3">

    <label class="form-label">
        Nome
    </label>

    <input
        type="text"
        id="nome"
        class="form-control"
        required>

</div>

<div class="mb-3">

    <label class="form-label">
        Cognome
    </label>

    <input
        type="text"
        id="cognome"
        class="form-control"
        required>

</div>

<div class="mb-3">

    <label class="form-label">
        Email
    </label>

    <input
        type="email"
        id="email"
        class="form-control"
        required>

</div>

<div class="mb-3">

    <label class="form-label">
        Telefono
    </label>

    <input
        type="text"
        id="telefono"
        class="form-control"
        required>

</div>



<div class="mb-3">

<label class="form-label">
Data visita
</label>

<input type="date"
id="dataVisita"
class="form-control"
required>

</div>




<div class="mb-3">

<label class="form-label">
Ora visita
</label>

<input type="time"
id="oraVisita"
class="form-control"
required>

</div>




<div class="mb-3">

<label class="form-label">
Numero ospiti
</label>

<input type="number"
id="numOspiti"
class="form-control"
min="1"
required>

</div>



<button class="btn btn-warning w-100">

Conferma prenotazione

</button>


</form>


<div id="messaggio" class="mt-3"></div>


</div>


</div>
